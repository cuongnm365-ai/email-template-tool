<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Khởi Tạo Email CSKH - Service Operation Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; display: flex; gap: 25px; }
        .form-section { flex: 1; max-width: 40%; }
        .preview-section { flex: 1; max-width: 60%; background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 6px; display: flex; flex-direction: column; }
        h2 { color: #f26f21; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #4a5568; font-size: 13px; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font-size: 13px; transition: all 0.2s ease; font-family: inherit; }
        input:focus, select:focus, textarea:focus { border-color: #f26f21; outline: none; box-shadow: 0 0 0 2px rgba(242, 111, 33, 0.2); }
        .hidden { display: none !important; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s ease; }
        .btn-primary { background-color: #f26f21; color: white; }
        .btn-primary:hover { background-color: #d95a14; }
        .btn-secondary { background-color: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background-color: #e2e8f0; }
        .output-header { font-weight: bold; color: #2d3748; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        
        /* Chữ ký hướng dẫn nổi bật */
        .signature-notice-box { background-color: #fffaf0; border-left: 4px solid #f26f21; padding: 12px; margin-top: 15px; border-radius: 4px; font-size: 12.5px; line-height: 1.5; color: #744210; }
        .signature-title { font-weight: bold; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        select optgroup { font-weight: bold; font-style: normal; color: #f26f21; background: #fff; }
        select option { color: #333; font-weight: normal; }

        #subjectWrapper { font-size: 13px; margin-bottom: 10px; padding: 8px; background: #fff; border: 1px dashed #cbd5e0; border-radius: 4px; }
        #emailSubject { font-weight: bold; color: #f26f21; }
        #emailContainer { background: #fff; padding: 20px; border: 1px solid #e2e8f0; min-height: 450px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 4px; overflow-y: auto; }
        #emailContent { font-size: 14.5px; line-height: 1.6; color: #2d3748; font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; }
        #emailSignature { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e2e8f0; font-size: 14px; line-height: 1.5; color: #4a5568; font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WN4FFVFN"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div class="container">
    <div class="form-section">
        <h2>Thông Tin Khởi Tạo</h2>
        
        <div class="form-group">
            <label for="templateType">Chọn mẫu email:</label>
            <select id="templateType" onchange="toggleFields()">
                <optgroup label="--- MẪU MỚI ---">
                    <option value="t_xin_thong_tin">Mẫu Mới 1: Xin thông tin hợp đồng (Thiếu thông tin)</option>
                    <option value="t_da_xu_ly">Mẫu Mới 2: KH đã xử lý xong (Giới thiệu báo hỏng nhanh)</option>
                    <option value="t_bao_hong">Mẫu Mới 3: Báo hỏng (Có CL kỹ thuật đang xử lý)</option>
                    <option value="t_thanh_toan">Mẫu Mới 4: Đáo hạn cước phí & Thanh toán</option>
                    <option value="t_kpdv">Mẫu Mới 5: Thủ tục khôi phục dịch vụ (KPDV)</option>
                    <option value="t_thanh_ly">Mẫu Mới 6: KH Thanh lý (Cứu vớt/Chuyển địa điểm)</option>
                    <option value="t_phuc_dap">Mẫu Mới 7: Khiếu nại nặng / Phúc đáp đơn thư</option>
                </optgroup>
                <optgroup label="--- MẪU CŨ ---">
                    <option value="o_failure">Mẫu Cũ 1: Thông báo sự cố / Báo hỏng</option>
                    <option value="o_payment">Mẫu Cũ 2: Thanh toán / Đáo hạn cước</option>
                    <option value="o_service">Mẫu Cũ 3: Thủ tục/dịch vụ</option>
                </optgroup>
            </select>
        </div>

        <div id="dynamicInputs">
            <div class="form-row">
                <div class="form-group" style="width: 35%;">
                    <label for="gender">Danh xưng:</label>
                    <select id="gender" onchange="generateEmail()">
                        <option value="Anh">Anh</option>
                        <option value="Chị">Chị</option>
                        <option value="Cô">Cô</option>
                        <option value="Chú">Chú</option>
                        <option value="Bác">Bác</option>
                        <option value="Doanh Nghiệp">Doanh Nghiệp</option>
                    </select>
                </div>
                <div class="form-group" style="width: 65%;">
                    <label for="customerName">Tên khách hàng:</label>
                    <input type="text" id="customerName" placeholder="Nhập tên KH" oninput="formatTitleCase(this)">
                </div>
            </div>

            <div class="form-group" id="contractGroup">
                <label for="contractId">Số hợp đồng / Đường truyền:</label>
                <input type="text" id="contractId" placeholder="Ví dụ: SGH859892, HNH123456" oninput="formatUpperCase(this)">
            </div>

            <div class="form-group" id="phoneGroup">
                <label for="phone">Số điện thoại đăng ký:</label>
                <input type="text" id="phone" placeholder="Ví dụ: 0912345689" oninput="generateEmail()">
            </div>

            <div class="form-group" id="addressGroup">
                <label for="address">Địa chỉ đường truyền:</label>
                <input type="text" id="address" placeholder="Nhập địa chỉ lắp đặt" oninput="formatTitleCase(this)">
            </div>

            <div class="form-group">
                <label for="staffName">Tên Agent xử lý:</label>
                <input type="text" id="staffName" placeholder="Nhập tên của bạn" oninput="formatTitleCase(this)">
            </div>

            <!-- Fields dùng chung cho Mẫu Mới 3 và Mẫu Cũ 1 -->
            <div id="fields_bao_hong" class="hidden dynamic-section">
                <div class="form-group">
                    <label for="expectedTime">Thời gian xử lý dự kiến:</label>
                    <input type="text" id="expectedTime" placeholder="Ví dụ: 15:30 - 17:30 31/05/2026" oninput="generateEmail()">
                </div>
                <div class="form-group">
                    <label for="techName">Kỹ thuật viên phục vụ:</label>
                    <input type="text" id="techName" placeholder="Ví dụ: Nguyễn Duy Khanh – 038***4707" oninput="formatTitleCase(this)">
                </div>
            </div>

            <!-- Fields dùng chung cho Mẫu Mới 4 và Mẫu Cũ 2 -->
            <div id="fields_thanh_toan" class="hidden dynamic-section">
                <div class="form-row">
                    <div class="form-group" style="width: 50%;">
                        <label for="cycleStart">Ngày bắt đầu trả trước:</label>
                        <input type="date" id="cycleStart" onchange="generateEmail()">
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label for="monthsCount">Gói cước trả trước:</label>
                        <select id="monthsCount" onchange="generateEmail()">
                            <option value="6">Trả trước 6 tháng</option>
                            <option value="12">Trả trước 12 tháng (Tặng 1 tháng)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="width: 50%;">
                        <label for="amount">Số tiền thanh toán:</label>
                        <input type="text" id="amount" placeholder="Ví dụ: 1.200.000" oninput="formatCurrencyInput(this)">
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label for="servicePackage">Gói dịch vụ:</label>
                        <input type="text" id="servicePackage" placeholder="Ví dụ: Internet Sky" oninput="formatTitleCase(this)">
                    </div>
                </div>
            </div>

            <!-- Mẫu Mới 5: KPDV -->
            <div id="fields_kpdv" class="hidden dynamic-section">
                <div class="form-group">
                    <label for="monthSuspend">Tháng bắt đầu tạm ngưng:</label>
                    <input type="text" id="monthSuspend" placeholder="Ví dụ: 03/2026" oninput="generateEmail()">
                </div>
                <div class="form-group">
                    <label for="monthDebt">Tháng còn nợ cước:</label>
                    <input type="text" id="monthDebt" placeholder="Ví dụ: 02/2026" oninput="generateEmail()">
                </div>
                <div class="form-group">
                    <label for="servicePackageKPDV">Gói dịch vụ đang dùng:</label>
                    <input type="text" id="servicePackageKPDV" placeholder="Ví dụ: Internet Meta – 277.000 VNĐ/tháng" oninput="generateEmail()">
                </div>
            </div>

            <!-- Mẫu Mới 7: Phúc đáp -->
            <div id="fields_phuc_dap" class="hidden dynamic-section">
                <div class="form-group">
                    <label for="emailPhucDap">Email khách hàng:</label>
                    <input type="text" id="emailPhucDap" placeholder="Ví dụ: dat.pvtudo@gmail.com" oninput="generateEmail()">
                </div>
                <div class="form-group">
                    <label for="khieuNai">Tóm tắt vấn đề khiếu nại/thắc mắc:</label>
                    <textarea id="khieuNai" rows="3" placeholder="Ví dụ: Yêu cầu giải đáp thông tin gói cước và chính sách gia hạn trả trước" oninput="generateEmail()"></textarea>
                </div>
                <div class="form-group">
                    <label for="huongXuLy">Đề xuất / Hướng xử lý:</label>
                    <textarea id="huongXuLy" rows="5" placeholder="Ví dụ: - Chuyển đổi gói dịch vụ sang Super300 Biz. &#10;- Giá cước mới: 450.000đ/tháng." oninput="generateEmail()"></textarea>
                </div>
                <div class="form-group">
                    <label for="chiNhanhPhucDap">Đơn vị / Chi nhánh phúc đáp:</label>
                    <input type="text" id="chiNhanhPhucDap" placeholder="Ví dụ: FPT Telecom chi nhánh Đống Đa Hà Nội" oninput="formatTitleCase(this)">
                </div>
            </div>
            
            <!-- Mẫu Cũ 3: Yêu cầu dịch vụ -->
            <div id="fields_o_service" class="hidden dynamic-section">
                <div class="form-group">
                    <label for="requestType">Nội dung yêu cầu:</label>
                    <select id="requestType" onchange="toggleCustomServiceField()">
                        <option value="cước phí">Cước Phí</option>
                        <option value="khiếu nại nhân viên">Khiếu Nại Nhân Viên</option>
                        <option value="TLTN">Thanh Lý Tạm Ngưng</option>
                        <option value="dịch vụ FPT Play">Dịch vụ FPT Play</option>
                        <option value="other">Khác</option>
                    </select>
                </div>
                <div class="form-group hidden" id="customRequestWrapper">
                    <label for="customRequest">Nhập nội dung yêu cầu khác:</label>
                    <input type="text" id="customRequest" placeholder="Ví dụ: thay đổi thông tin chủ thể, chuyển địa điểm..." oninput="generateEmail()">
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="resetForm()">Xóa nhập lại</button>
            <button class="btn-primary" onclick="copyToClipboard()">Sao chép nội dung email</button>
        </div>

        <div id="signatureNotice" class="signature-notice-box"></div>
    </div>

    <div class="preview-section">
        <div class="output-header">Xem trước nội dung hiển thị</div>
        <div id="subjectWrapper"><b>Tiêu đề:</b> <span id="emailSubject"></span></div>
        <div id="emailContainer">
            <div id="emailContent">Vui lòng điền thông tin...</div>
            <div id="emailSignature"></div>
        </div>
    </div>
</div>

<script>
    const QR_IMAGES = {
        failure: "https://tools.manhcuongit.online/images/image/bao-hong-nhanh.jpg",
        payment: "https://tools.manhcuongit.online/images/image/bao-hong-nhanh.jpg",
        service: "https://tools.manhcuongit.online/images/image/bao-hong-nhanh.jpg"
    };

    const DEEPLINKS = {
        failure: "https://hi.fpt.vn/rev/esv/Mq9r4jlG",
        payment: "https://hi.fpt.vn/rev/fbu/1dnN3BoM",
        service: "https://hi.fpt.vn/rev/lbq/P3M3JDZB"
    };

    function formatTitleCase(input) {
        let cursor = input.selectionStart;
        let text = input.value;
        text = text.toLowerCase().split(' ').map(word => {
            return word.charAt(0).toUpperCase() + word.slice(1);
        }).join(' ');
        input.value = text;
        input.setSelectionRange(cursor, cursor);
        generateEmail();
    }

    function formatUpperCase(input) {
        let cursor = input.selectionStart;
        input.value = input.value.toUpperCase();
        input.setSelectionRange(cursor, cursor);
        generateEmail();
    }

    function formatCurrencyInput(input) {
        // Tự động định dạng dấu chấm 
        let val = input.value.replace(/\\D/g, "");
        if (val !== "") {
            input.value = val.replace(/\\B(?=(\\d{3})+(?!\\d))/g, ".");
        } else {
            input.value = "";
        }
        generateEmail();
    }

    function getCalculatedCycleInfo(isOldTemplate) {
        const startDateVal = document.getElementById('cycleStart').value;
        const selection = document.getElementById('monthsCount').value;
        
        let labelText = "";
        let monthsToAdd = 0;
        if (selection === "6") {
            labelText = "Kỳ hạn 6 tháng";
            monthsToAdd = 6;
        } else if (selection === "12") {
            labelText = (isOldTemplate) ? "Kỳ hạn 13 tháng" : "Kỳ hạn 13 tháng"; 
            monthsToAdd = 13;
        }

        if (!startDateVal) {
            return `<li style="margin-bottom: 4px;"><b>${labelText}:</b> <span style="font-style: italic;">Từ ... đến ...</span></li>`;
        }
        const startDate = new Date(startDateVal);
        const endDate = new Date(startDateVal);
        endDate.setMonth(startDate.getMonth() + monthsToAdd);
        endDate.setDate(endDate.getDate() - 1);

        const formatBtn = (date) => {
            let d = date.getDate().toString().padStart(2, '0');
            let m = (date.getMonth() + 1).toString().padStart(2, '0');
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        };

        return `<li style="margin-bottom: 4px;"><b>${labelText}:</b> <span style="font-style: italic;">Từ <b>${formatBtn(startDate)}</b> đến <b>${formatBtn(endDate)}</b></span></li>`;
    }

    function toggleCustomServiceField() {
        const requestType = document.getElementById('requestType').value;
        const customWrapper = document.getElementById('customRequestWrapper');
        if (requestType === 'other') {
            customWrapper.classList.remove('hidden');
        } else {
            customWrapper.classList.add('hidden');
        }
        generateEmail();
    }

    function toggleFields() {
        const type = document.getElementById('templateType').value;
        const sections = document.querySelectorAll('.dynamic-section');
        sections.forEach(sec => sec.classList.add('hidden'));
        
        // Mặc định hiện
        document.getElementById('contractGroup').classList.remove('hidden');
        document.getElementById('phoneGroup').classList.remove('hidden');
        document.getElementById('addressGroup').classList.remove('hidden');

        // Logic ẩn hiện
        if (type === 't_xin_thong_tin') {
            document.getElementById('contractGroup').classList.add('hidden');
            document.getElementById('phoneGroup').classList.add('hidden');
            document.getElementById('addressGroup').classList.add('hidden');
        } else if (type === 't_da_xu_ly') {
            document.getElementById('contractGroup').classList.add('hidden');
            document.getElementById('addressGroup').classList.add('hidden');
        } else if (type === 't_bao_hong' || type === 'o_failure') {
            document.getElementById('fields_bao_hong').classList.remove('hidden');
        } else if (type === 't_thanh_toan' || type === 'o_payment') {
            document.getElementById('fields_thanh_toan').classList.remove('hidden');
        } else if (type === 't_kpdv') {
            document.getElementById('fields_kpdv').classList.remove('hidden');
        } else if (type === 't_phuc_dap') {
            document.getElementById('fields_phuc_dap').classList.remove('hidden');
        } else if (type === 'o_service') {
            document.getElementById('fields_o_service').classList.remove('hidden');
            toggleCustomServiceField();
        }
        
        updateSignatureNotice(type);
        generateEmail();
    }

    function updateSignatureNotice(type) {
        const noticeBox = document.getElementById('signatureNotice');
        if (type === 't_phuc_dap') {
            noticeBox.innerHTML = `<div class="signature-title" style="color: #c53030;">⚠️ HƯỚNG DẪN CHỮ KÝ: SỬ DỤNG MẪU B (CÓ QR CÀI ĐẶT)</div>` +
                   `Sử dụng chào kết thúc và chữ ký <b>CÓ kèm ảnh QR cài đặt tổng thể</b>. Áp dụng cho tình huống loop mail trao đổi qua lại nhiều lần, hoặc khiếu nại nghiêm trọng, phúc đáp đơn thư văn bản chính thức của khách hàng.`;
        } else {
            noticeBox.innerHTML = `<div class="signature-title">⚠️ HƯỚNG DẪN CHỮ KÝ: SỬ DỤNG MẪU A (ƯU TIÊN)</div>` +
                   `Sử dụng chào kết thúc và chữ ký <b>KHÔNG kèm ảnh QR tổng thể</b>. Do nội dung của email phía trên đã được tích hợp bảng khung chứa mã QR điều hướng tính năng của Hi FPT để tránh loãng thông tin và tăng tỷ lệ click chu đáo.`;
        }
    }

    function createInfoBoxHTML(contentHtml, qrImage, deeplink) {
        let qrSection = "";
        if (qrImage && deeplink) {
            qrSection = `<td width="140" align="center" valign="middle" style="padding: 15px; border-left: 1px dashed #cbd5e0;">
                            <a href="${deeplink}" target="_blank" style="text-decoration: none;">
                                <img src="${qrImage}" alt="QR Code" width="130" style="display: block; max-width: 100%; border: 1px solid #cbd5e0; padding: 4px; background: #fff; border-radius: 4px;">
                            </a>
                        </td>`;
        }
        return `<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #f26f21; border-radius: 4px; margin: 15px 0;">
                    <tr>
                        <td valign="middle" style="padding: 15px; font-family: 'Aptos', Arial, sans-serif; font-size: 14.5px; color: #2d3748; line-height: 1.6;">
                            ${contentHtml}
                        </td>
                        ${qrSection}
                    </tr>
                </table>`;
    }

    function generateEmail() {
        const type = document.getElementById('templateType').value;
        const genderSelect = document.getElementById('gender').value;
        const customerName = document.getElementById('customerName').value || '[Tên KH]';
        const contractId = document.getElementById('contractId').value || '[Mã KH/Hợp Đồng]';
        const phone = document.getElementById('phone').value || '[SĐT KH]';
        const address = document.getElementById('address').value || '[Địa chỉ đường truyền]';
        const staffName = document.getElementById('staffName').value || '[Tên Agent]';

        let honorific = genderSelect;
        let pronoun = (genderSelect === 'Doanh Nghiệp') ? 'Quý công ty' : genderSelect;
        if (genderSelect === 'Doanh Nghiệp') honorific = 'Quý công ty';

        let subject = "";
        let bodyHtml = "";
        let sigHtml = "";
        
        const baseStyle = `font-family: 'Aptos', Arial, sans-serif; font-size: 14.5px; color: #2d3748; line-height: 1.6;`;

        // ======================= CÁC MẪU MỚI (SOC 2026) =======================
        if (type === 't_xin_thong_tin') {
            subject = `[Xử Lý] Tiếp nhận làm rõ thông tin thắc mắc hợp đồng`;
            let boxContent = `<ul style="margin: 0; padding-left: 20px;">
                                <li style="margin-bottom: 4px;"><b>Số điện thoại liên hệ</b> hoặc <b>Số hợp đồng</b></li>
                                <li style="margin-bottom: 4px;"><b>Gói dịch vụ</b> đang sử dụng <i>(nếu có)</i></li>
                              </ul>
                              <p style="margin-bottom:0; font-style: italic;">➔ Chi tiết vui lòng lấy tại ứng dụng <b>Hi FPT</b> (quét hoặc chạm mã QR bên cạnh, đăng nhập bằng SĐT đăng ký với FPT Telecom).</p>`;

            bodyHtml = `<div style="${baseStyle}">
                Thân chào ${honorific} <b>${customerName}</b>,<br><br>

                Khi cần báo hỏng hoặc yêu cầu hỗ trợ khác, ${pronoun.toLowerCase()} có thể quét mã QR để gửi yêu cầu trực tiếp trên <b>Ứng dụng Hi FPT</b> tại mục <b>"Hỗ trợ"</b> hoặc <b>"Báo hỏng nhanh"</b> sẽ được phục vụ nhanh chóng mà không cần gọi hotline.<br><br>
                FPT Telecom cảm ơn ${pronoun.toLowerCase()} <b>${customerName}</b> đã liên hệ ạ.
                </div>`;
            sigHtml = `Trân trọng,<br><b>Trung tâm CSKH FPT Telecom</b>`;
        }
        else if (type === 'o_service') {
            const requestSelect = document.getElementById('requestType').value;
            let finalRequestText = (requestSelect === 'other') ? (document.getElementById('customRequest').value.trim() || 'yêu cầu thủ tục / dịch vụ') : requestSelect;

            subject = `[Thông Báo] Tiếp nhận hỗ trợ dịch vụ thủ tục khách hàng - HĐ: ${contractId}`;
            let boxContent = `<ul style="margin: 0; padding-left: 20px;">
                                <li style="margin-bottom: 4px;">Khi có thông tin kết quả xử lý bên em sẽ liên hệ lại <b>${pronoun.toLowerCase()}</b> qua số điện thoại <b>${phone}</b> để phản hồi kết quả xử lý.</li>
                              </ul>
                              <p style="margin-bottom:0; font-style: italic;">Theo dõi tiến độ trực tiếp hoặc tương tác nhanh hơn ngay tại ứng dụng <b>Hi FPT</b> (quét hoặc chạm mã QR bên cạnh).</p>`;

            bodyHtml = `<div style="${baseStyle}">
                Thân chào ${honorific} <b>${customerName}</b>,<br><br>
                Em là <b>${staffName}</b> - Nhân viên Chăm sóc Khách hàng FPT Telecom.<br><br>
                Bên em đã ghi nhận yêu cầu về <b>${finalRequestText}</b> của ${pronoun.toLowerCase()} đối với Số hợp đồng <b>${contractId}</b> tại địa chỉ <b>${address}</b>. Hiện tại, bên em sẽ phối hợp cùng bộ phận phụ trách để thực hiện kiểm tra, đối soát nhằm xử lý nhanh chóng, dứt điểm yêu cầu.<br>
                ${createInfoBoxHTML(boxContent, QR_IMAGES.service, DEEPLINKS.service)}
                Trong quá trình sử dụng, khi cần báo hỏng hoặc yêu cầu hỗ trợ khác, ${pronoun.toLowerCase()} có thể quét mã QR để gửi yêu cầu trực tiếp trên <b>Ứng dụng Hi FPT</b> tại mục <b>"Hỗ trợ"</b> hoặc <b>"Báo hỏng nhanh"</b>. Bên em sẽ phục vụ nhanh chóng mà không cần gọi hotline.<br><br>
                Chân thành cảm ơn <b>${pronoun.toLowerCase()} ${customerName}</b> đã tin tưởng và sử dụng dịch vụ của FPT Telecom.
                </div>`;
            sigHtml = `Trân trọng,<br><b>Trung tâm CSKH FPT Telecom</b>`;
        }

        document.getElementById('emailSubject').innerText = subject;
        document.getElementById('emailContent').innerHTML = bodyHtml;
        document.getElementById('emailSignature').innerHTML = sigHtml;
    }

    function copyToClipboard() {
        const contentHtml = document.getElementById('emailContent').innerHTML;
        const fullHtml = `<div style="font-family: 'Aptos', Arial, sans-serif; font-size: 14.5px; color: #2d3748;">${contentHtml}</div>`;

        if (navigator.clipboard && window.ClipboardItem && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            const blobHtml = new Blob([fullHtml], { type: 'text/html' });
            const data = [new ClipboardItem({ 'text/html': blobHtml })];

            navigator.clipboard.write(data).then(() => {
                alert("Đã sao chép riêng phần NỘI DUNG EMAIL (bao gồm cả định dạng, bảng, in đậm)! Hãy dán (Ctrl+V) vào Outlook.");
            }).catch(err => fallbackCopy());
        } else {
            fallbackCopy();
        }
    }

    function fallbackCopy() {
        const emailContent = document.getElementById('emailContent');
        const range = document.createRange();
        range.selectNode(emailContent);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        
        try {
            document.execCommand('copy');
            alert("Hệ thống đã chọn vùng NỘI DUNG EMAIL. Đã copy thành công, hãy dán vào Outlook!");
        } catch (err) {
            alert("Vui lòng bôi đen nội dung trong phần Xem trước rồi nhấn Ctrl+C để copy.");
        }
        window.getSelection().removeAllRanges();
    }

    function resetForm() {
        document.getElementById('contractId').value = '';
        document.getElementById('customerName').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('address').value = '';
        document.getElementById('staffName').value = '';
        
        const dynamicInputs = document.querySelectorAll('.dynamic-section input, .dynamic-section textarea');
        dynamicInputs.forEach(input => input.value = '');
        
        document.getElementById('gender').value = 'Anh';
        generateEmail();
    }

    toggleFields();
</script>
</body>
</html>

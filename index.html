<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Khởi Tạo Email CSKH FPT Telecom</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 870px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; display: flex; gap: 20px; }
        .form-section { flex: 1; max-width: 45%; }
        .preview-section { flex: 1; max-width: 55%; background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 6px; display: flex; flex-direction: column; }
        h2 { color: #f26f21; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #4a5568; font-size: 13px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input:focus, select:focus { border-color: #f26f21; outline: none; box-shadow: 0 0 0 2px rgba(242, 111, 33, 0.2); }
        .hidden { display: none; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background-color: #f26f21; color: white; }
        .btn-primary:hover { background-color: #d95a14; }
        .btn-secondary { background-color: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background-color: #e2e8f0; }
        .output-header { font-weight: bold; color: #2d3748; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        #emailSubject { font-weight: bold; color: #f26f21; margin-bottom: 10px; padding: 8px; background: #fff; border: 1px dashed #cbd5e0; font-size: 13px; }
        #emailContent { background: #fff; padding: 15px; border: 1px solid #e2e8f0; min-height: 320px; font-size: 14px; line-height: 1.6; flex-grow: 1; overflow-y: auto; color: #2d3748; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-section">
        <h2>Thông Tin Khởi Tạo</h2>
        
        <div class="form-group">
            <label for="templateType">Chọn mẫu email cấu trúc:</label>
            <select id="templateType" onchange="toggleFields()">
                <option value="failure">Mẫu 1: Thông báo sự cố / Báo hỏng</option>
                <option value="payment">Mẫu 2: Thanh toán / Đáo hạn cước</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group" style="width: 35%;">
                <label for="gender">Danh xưng:</label>
                <select id="gender" onchange="generateEmail()">
                    <option value="Anh">Anh</option>
                    <option value="Chị">Chị</option>
                </select>
            </div>
            <div class="form-group" style="width: 65%;">
                <label for="customerName">Tên khách hàng:</label>
                <input type="text" id="customerName" placeholder="Nhập tên KH" oninput="generateEmail()">
            </div>
        </div>

        <div class="form-group">
            <label for="contractId">Số hợp đồng:</label>
            <input type="text" id="contractId" placeholder="Ví dụ: Hnh123456" oninput="generateEmail()">
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại khách hàng:</label>
            <input type="text" id="phone" placeholder="Ví dụ: 0912345689" oninput="generateEmail()">
        </div>

        <div class="form-group">
            <label for="address">Địa chỉ:</label>
            <input type="text" id="address" placeholder="Ví dụ: Phường Cầu Giấy, Hà Nội" oninput="generateEmail()">
        </div>

        <div id="failureFields">
            <div class="form-group">
                <label for="expectedTime">Thời gian xử lý dự kiến:</label>
                <input type="text" id="expectedTime" placeholder="Ví dụ: 17:00 ngày 30/05/2026" oninput="generateEmail()">
            </div>
            <div class="form-group">
                <label for="techName">Kỹ thuật viên:</label>
                <input type="text" id="techName" placeholder="Ví dụ: Nguyễn Văn A" oninput="generateEmail()">
            </div>
        </div>

        <div id="paymentFields" class="hidden">
            <div class="form-row">
                <div class="form-group" style="width: 50%;">
                    <label for="cycleStart">Ngày bắt đầu trả trước tiếp tục:</label>
                    <input type="date" id="cycleStart" onchange="generateEmail()">
                </div>
                <div class="form-group" style="width: 50%;">
                    <label for="monthsCount">Gói cước trả trước:</label>
                    <select id="monthsCount" onchange="generateEmail()">
                        <option value="6">Trả trước 6 tháng</option>
                        <option value="12">Trả trước 12 tháng (Tặng 1 tháng)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="width: 100%;">
                    <label for="amount">Số tiền thanh toán:</label>
                    <input type="text" id="amount" placeholder="Ví dụ: 12000000" oninput="generateEmail()">
                </div>
            </div>
            <div class="form-group">
                <label for="servicePackage">Gói dịch vụ:</label>
                <input type="text" id="servicePackage" placeholder="Ví dụ: Giga, Sky, Meta..." oninput="generateEmail()">
            </div>
            <div class="form-group">
                <label for="staffName">Tên nhân viên CSKH:</label>
                <input type="text" id="staffName" placeholder="Nhập tên của bạn" oninput="generateEmail()">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="resetForm()">Xóa nhập lại</button>
            <button class="btn-primary" onclick="copyToClipboard()">Sao chép nội dung</button>
        </div>
    </div>

    <div class="preview-section">
        <div class="output-header">Xem trước nội dung hiển thị</div>
        <div id="emailSubject">Tiêu đề: </div>
        <div id="emailContent">Vui lòng điền thông tin...</div>
    </div>
</div>

<script>
    // Hệ thống liên kết ảnh trực tiếp từ đường dẫn máy chủ của bạn
    const QR_IMAGES = {
        failure: "http://tools.manhcuongit.online/BAOHONGNHANH.jpg",
        payment: "http://tools.manhcuongit.online/THANHTOANNHANH.jpg"
    };

    function toggleFields() {
        const type = document.getElementById('templateType').value;
        const failureFields = document.getElementById('failureFields');
        const paymentFields = document.getElementById('paymentFields');
        
        if (type === 'failure') {
            failureFields.classList.remove('hidden');
            paymentFields.classList.add('hidden');
        } else {
            failureFields.classList.add('hidden');
            paymentFields.classList.remove('hidden');
        }
        generateEmail();
    }

    function capitalizeFirstLetter(str) {
        if (!str) return '';
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function formatCurrency(value) {
        if (!value) return '....';
        let cleanValue = value.toString().replace(/\D/g, '');
        if (!cleanValue) return '....';
        return new Intl.NumberFormat('vi-VN').format(cleanValue) + " Đ";
    }

    function getCalculatedCycleInfo() {
        const startDateVal = document.getElementById('cycleStart').value;
        const selection = document.getElementById('monthsCount').value;
        
        let labelText = "";
        let monthsToAdd = 0;

        if (selection === "6") {
            labelText = "Kỳ hạn 6 tháng";
            monthsToAdd = 6;
        } else if (selection === "12") {
            labelText = "Kỳ hạn 13 tháng";
            monthsToAdd = 13;
        }

        if (!startDateVal) {
            return `• <b>${labelText}:</b> Từ ../../.... đến ../../....`;
        }

        const startDate = new Date(startDateVal);
        const endDate = new Date(startDateVal);
        endDate.setMonth(startDate.getMonth() + monthsToAdd);

        const formatBtn = (date) => {
            let d = date.getDate().toString().padStart(2, '0');
            let m = (date.getMonth() + 1).toString().padStart(2, '0');
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        };

        return `• <b>${labelText}:</b> Từ ${formatBtn(startDate)} đến ${formatBtn(endDate)}`;
    }

    function generateEmail() {
        const type = document.getElementById('templateType').value;
        const gender = document.getElementById('gender').value;
        const genderLower = gender.toLowerCase();
        
        const customerName = capitalizeFirstLetter(document.getElementById('customerName').value) || '[Tên KH]';
        const contractId = capitalizeFirstLetter(document.getElementById('contractId').value) || '[Số hợp đồng]';
        const phone = document.getElementById('phone').value || '[SĐT KH]';
        const address = capitalizeFirstLetter(document.getElementById('address').value) || '...';
        
        const currentQrUrl = QR_IMAGES[type];
        
        let emailHtml = "";
        let subject = "";

        if (type === 'failure') {
            const expectedTime = document.getElementById('expectedTime').value || '...';
            const techName = capitalizeFirstLetter(document.getElementById('techName').value) || '....';

            subject = `[Báo Hỏng] Ghi nhận xử lý sự cố đường truyền mạng - HĐ: ${contractId}`;
            
            emailHtml = `<div style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #2d3748; line-height: 1.6;">` +
                `Thân chào ${gender} ${customerName},<br><br>` +
                `Bên em đã ghi nhận vấn đề gián đoạn tại đường truyền [${contractId}] tại ${address} và sẽ cử kỹ thuật viên qua phục vụ trực tiếp tại nhà.<br><br>` +
                
                `<table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 10px; margin-bottom: 10px;">` +
                    `<tr>` +
                        `<td width="65%" valign="middle" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #2d3748; line-height: 1.8; padding-right: 15px;">` +
                            `• <b>Thời gian xử lý dự kiến:</b> ${expectedTime}<br>` +
                            `• <b>Kỹ thuật viên:</b> ${techName}<br><br>` +
                            `Chi tiết tiến độ xử lý và thông tin kỹ thuật viên, vui lòng xem tại ứng dụng <b>Hi FPT</b> <i>(quét hoặc chạm mã QR bên cạnh, đăng nhập bằng SĐT ${phone})</i>.` +
                        `</td>` +
                        `<td width="35%" align="center" valign="middle">` +
                            `<img src="${currentQrUrl}" alt="Mã QR Hi FPT" width="160" style="display: block; max-width: 100%; height: auto; border: 1px solid #e2e8f0; padding: 5px; background: #fff;">` +
                        `</td>` +
                    `</tr>` +
                `</table><br>` +
                
                `Lần tới khi cần báo hỏng hoặc yêu cầu hỗ trợ khác, ${genderLower} có thể gửi yêu cầu trực tiếp ngay trên <b>Ứng dụng Hi FPT</b> tại mục <b>"Hỗ trợ"</b> hoặc <b>"Báo hỏng nhanh"</b> mà không cần chờ đợi gọi lên tổng đài.<br><br>` +
                `FPT Telecom cảm ơn ${genderLower} ${customerName} đã liên hệ ạ.<br><br>` +
                `Trân trọng,<br>` +
                `<b>Trung tâm CSKH FPT Telecom</b>` +
                `</div>`;
        } 
        else if (type === 'payment') {
            const amountInput = document.getElementById('amount').value;
            const formattedAmount = formatCurrency(amountInput);
            const servicePackage = capitalizeFirstLetter(document.getElementById('servicePackage').value) || '....';
            const staffName = capitalizeFirstLetter(document.getElementById('staffName').value) || '[Tên nhân viên]';
            const cycleInfoLine = getCalculatedCycleInfo();
            const selection = document.getElementById('monthsCount').value;
            const displayMonthText = (selection === "6") ? "6" : "12";

            subject = `[Thông Báo] Nhắc gia hạn và Đáo hạn cước dịch vụ Internet - HĐ: ${contractId}`;
            
            emailHtml = `<div style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #2d3748; line-height: 1.6;">` +
                `Thân chào ${gender} ${customerName},<br><br>` +
                `Em là ${staffName} - CSKH FPT Telecom.<br><br>` +
                `Hiện tại hợp đồng ${contractId} tại ${address} đã đến kỳ gia hạn trả trước.<br><br>` +
                `Em gửi ${genderLower} thông tin thanh toán kỳ ${displayMonthText} tháng tiếp theo cho gói mới như sau:<br><br>` +
                
                `<table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 10px; margin-bottom: 10px;">` +
                    `<tr>` +
                        `<td width="65%" valign="middle" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #2d3748; line-height: 1.8; padding-right: 15px;">` +
                            `• <b>Số tiền cần thanh toán:</b> ${formattedAmount}<br>` +
                            `${cycleInfoLine}<br>` +
                            `• <b>Gói dịch vụ:</b> ${servicePackage}<br><br>` +
                            `Thanh toán nhanh, an toàn & dễ dàng kiểm tra tình trạng thanh toán ngay tại ứng dụng <b>Hi FPT</b> <i>(quét hoặc chạm mã QR bên cạnh, đăng nhập SĐT ${phone})</i>.` +
                        `</td>` +
                        `<td width="35%" align="center" valign="middle">` +
                            `<img src="${currentQrUrl}" alt="Mã QR Thanh Toán" width="160" style="display: block; max-width: 100%; height: auto; border: 1px solid #e2e8f0; padding: 5px; background: #fff;">` +
                        `</td>` +
                    `</tr>` +
                `</table><br>` +
                
                `Hoàn tất thanh toán, ${genderLower} ${customerName} sẽ được tặng <b>3000 gold vào tài khoản Khách hàng thân thiết</b> đấy ạ. ${gender} có thể sử dụng điểm tích lũy này để đổi các Evoucher hấp dẫn ngay trên ứng dụng Hi FPT tại mục <b>"Ưu đãi"</b>.<br><br>` +
                `Khi cần báo hỏng hoặc yêu cầu hỗ trợ khác, ${genderLower} có thể gửi yêu cầu trực tiếp trên <b>Ứng dụng Hi FPT</b> tại mục <b>"Hỗ trợ"</b> hoặc <b>"Báo hỏng nhanh"</b> để được hỗ trợ nhanh chóng mà không cần gọi tổng đài ạ.<br><br>` +
                `FPT Telecom cảm ơn ${genderLower} ${customerName} đã liên hệ ạ.<br><br>` +
                `Trân trọng,<br>` +
                `<b>Trung tâm CSKH FPT Telecom</b>` +
                `</div>`;
        }

        document.getElementById('emailSubject').innerText = "Tiêu đề: " + subject;
        document.getElementById('emailContent').innerHTML = emailHtml;
    }

    function copyToClipboard() {
        const subject = document.getElementById('emailSubject').innerText;
        const contentHtml = document.getElementById('emailContent').innerHTML;
        const contentText = document.getElementById('emailContent').innerText;
        
        const fullHtml = `<div style="font-family: 'Segoe UI', Arial, sans-serif;"><p><b>${subject}</b></p>${contentHtml}</div>`;
        const fullText = subject + "\n\n" + contentText;

        const blobHtml = new Blob([fullHtml], { type: 'text/html' });
        const blobText = new Blob([fullText], { type: 'text/plain' });

        const data = [new ClipboardItem({
            'text/html': blobHtml,
            'text/plain': blobText
        })];

        navigator.clipboard.write(data).then(() => {
            alert("Đã sao chép! Hãy dán (Ctrl+V) thẳng vào Outlook để giữ nguyên bố cục chữ in đậm và ảnh QR nằm bên phải.");
        }).catch(err => {
            navigator.clipboard.writeText(fullText);
            alert("Đã sao chép dữ liệu dạng văn bản thuần.");
        });
    }

    function resetForm() {
        document.getElementById('contractId').value = '';
        document.getElementById('customerName').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('address').value = '';
        document.getElementById('expectedTime').value = '';
        document.getElementById('techName').value = '';
        document.getElementById('cycleStart').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('servicePackage').value = '';
        generateEmail();
    }

    generateEmail();
</script>

</body>
</html>

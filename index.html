    function handleGenderChange() {
        const gender = document.getElementById('gender').value;
        const nameInput = document.getElementById('customerName');
        
        if (gender === 'Doanh Nghiệp') {

    function toggleFields() {
        const type = document.getElementById('templateType').value;
        const dynamicInputs = document.getElementById('dynamicInputs');
        const failureFields = document.getElementById('failureFields');
        const paymentFields = document.getElementById('paymentFields');
        const serviceFields = document.getElementById('serviceFields');
        const subjectWrapper = document.getElementById('subjectWrapper');
        
        if (type === 'signature_test') {
            dynamicInputs.classList.add('hidden');
            subjectWrapper.classList.add('hidden');
        } else {
            dynamicInputs.classList.remove('hidden');
            subjectWrapper.classList.remove('hidden');
            
            failureFields.classList.add('hidden');
            paymentFields.classList.add('hidden');
            serviceFields.classList.add('hidden');

            if (type === 'failure') {
                failureFields.classList.remove('hidden');
            } else if (type === 'payment') {
                paymentFields.classList.remove('hidden');
            } else if (type === 'service') {
                serviceFields.classList.remove('hidden');
                toggleCustomServiceField();
            }
        }
        generateEmail();
    }

    function toggleCustomServiceField() {
        const requestType = document.getElementById('requestType').value;
        const customWrapper = document.getElementById('customRequestWrapper');
        if (requestType === 'other') {
            customWrapper.classList.remove('hidden');
        } else {

    function capitalizeFirstLetter(str) {
        if (!str) return '';
        return str.trim().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    function formatCurrency(value) {
        if (!value) return '....';
        let cleanValue = value.toString().replace(/\D/g, '');
        if (!cleanValue) return '....';
        return new Intl.NumberFormat('vi-VN').format(cleanValue) + " Đ";
    }

    function getCalculatedCycleInfo() {
        const startDateVal = document.getElementById('cycleStart').value;
        const selection = document.getElementById('monthsCount').value;
        
        let labelText = "";
        let monthsToAdd = 0;

        if (selection === "6") {
            labelText = "Kỳ hạn 6 tháng";
            monthsToAdd = 6;
        } else if (selection === "12") {
            labelText = "Kỳ hạn 13 tháng";
            monthsToAdd = 13;
        }

        if (!startDateVal) {
            return `• <span style="font-weight: bold;">${labelText}:</span> Từ ../../.... đến ../../....`;
        }

        const startDate = new Date(startDateVal);
        const endDate = new Date(startDateVal);
        
        endDate.setMonth(startDate.getMonth() + monthsToAdd);
        endDate.setDate(endDate.getDate() - 1);

        const formatBtn = (date) => {
            let d = date.getDate().toString().padStart(2, '0');
            let m = (date.getMonth() + 1).toString().padStart(2, '0');
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        };

        return `• <span style="font-weight: bold;">${labelText}:</span> Từ ${formatBtn(startDate)} đến ${formatBtn(endDate)}`;
    }

    function copyToClipboard() {
        const contentHtml = document.getElementById('emailContent').innerHTML;
        const contentText = document.getElementById('emailContent').innerText;
        
        const fullHtml = `<div style="font-family: 'Aptos', Arial, sans-serif; font-size: 14.5px; color: #2d3748;">${contentHtml}</div>`;
        const fullText = contentText;

        if (navigator.clipboard && window.ClipboardItem && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            const blobHtml = new Blob([fullHtml], { type: 'text/html' });
            const blobText = new Blob([fullText], { type: 'text/plain' });

            const data = [new ClipboardItem({
                'text/html': blobHtml,
                'text/plain': blobText
            })];

            navigator.clipboard.write(data).then(() => {
                alert("Đã sao chép nội dung email! Hãy dán (Ctrl+V) vào Outlook.");
            }).catch(err => {
                copyAsPlainText(fullText);
            });
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = fullText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            alert("Đã copy dạng văn bản tĩnh.\n\nĐể dán sang Outlook có đủ IN ĐẬM và HÌNH ẢNH ở môi trường offline, bạn hãy dùng chuột bôi đen vùng Xem trước rồi nhấn Ctrl+C nhé!");
        }
    }

    function copyAsPlainText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Đã sao chép nội dung dạng văn bản tĩnh.");
            });
        }
    }
